<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>拉面节奏 - 抢拍判定版</title>
    <style>
        :root {
            --primary-blue: #104e8b;
            --bg-color: #fdfdfd;
            --active-color: #ffaa00;
            --listen-color: #9E9E9E;
            --ready-color: #42A5F5; /* 准备阶段的浅蓝 */
            --play-color: #1976D2;  /* 正式演奏的深蓝 */
            --success-color: #4CAF50;
            --fail-color: #F44336;
        }

        html, body {
            margin: 0; padding: 0; width: 100%; height: 100%;
            overflow: hidden; background-color: var(--bg-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            touch-action: none; user-select: none; -webkit-user-select: none;
        }

        .game-wrapper {
            display: flex; flex-direction: column; width: 100%; height: 100%;
        }

        .header {
            flex: 0 0 50px; display: flex; justify-content: space-between; align-items: center;
            padding: 0 15px; background: #fff; border-bottom: 1px solid #ddd;
        }
        .header h1 { font-size: 16px; margin: 0; color: #333; }
        .bpm-ctrl { display: flex; align-items: center; font-size: 14px; gap: 8px; }

        .phase-bar {
            height: 30px; display: flex; align-items: center; justify-content: center;
            font-weight: bold; font-size: 14px; color: white; letter-spacing: 1px;
            transition: background 0.1s;
        }
        .phase-bar.listen { background: var(--listen-color); }
        .phase-bar.ready { background: var(--ready-color); }
        .phase-bar.play { background: var(--play-color); }
        .phase-bar.done { background: var(--success-color); }
        .phase-bar.fail { background: var(--fail-color); }

        .score-section {
            flex: 0 0 110px; background: #fff; position: relative;
            display: flex; align-items: center; justify-content: center;
            border-bottom: 1px solid #f0f0f0;
        }
        .staff-lines {
            position: absolute; width: 80%; height: 60px;
            background-image: repeating-linear-gradient(0deg, #333, #333 1px, transparent 1px, transparent 14px);
            background-size: 100% 15px; top: 25px; z-index: 0;
        }
        .time-signature {
            position: absolute; left: 15%; top: 25px; z-index: 1;
            font-family: 'Times New Roman', serif; font-weight: bold; font-size: 36px; line-height: 0.8;
            display: flex; flex-direction: column; align-items: center; color: #000;
        }
        .note-display {
            z-index: 2; display: flex; align-items: center; gap: 20px;
            margin-left: 40px; transform: translateY(-5px);
        }

        .main-stage {
            flex: 1; display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            position: relative; width: 100%;
        }

        .rhythm-svg {
            width: 55vw; height: 55vw; max-width: 240px; max-height: 240px;
            margin-bottom: 20px; transition: opacity 0.2s;
        }
        .sector { fill: #fff; stroke: #ccc; stroke-width: 2; transition: fill 0.05s; }
        .sector.filled { fill: var(--active-color); stroke: var(--active-color); }
        .border-line { stroke: #fff; stroke-width: 3; }

        .noodle-area { height: 80px; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .noodle-viz { display: flex; align-items: center; gap: 10px; position: relative; }
        .hand { font-size: 24px; transition: transform 0.1s; }
        .hand.l { transform: scaleX(-1) rotate(90deg); }
        .hand.r { transform: rotate(90deg) scaleY(-1); }
        
        .dough { 
            width: 100px; height: 10px; background: #eecd86; 
            border: 2px solid #c9a44d; border-radius: 5px; 
            transition: width 0.3s, transform 0.1s, opacity 0.1s;
        }
        .pulling .dough { transform: scaleX(1.4); }
        .pulling .hand.l { transform: translateX(-20px) scaleX(-1) rotate(90deg); }
        .pulling .hand.r { transform: translateX(20px) rotate(90deg) scaleY(-1); }
        .broken .dough { 
            background: #F44336; border-color: #D32F2F; 
            width: 10px; opacity: 0; 
            transform: translateY(20px) rotate(45deg); 
        }

        /* 按钮状态 */
        .hit-btn {
            flex: 0 0 35%; background: #ccc; 
            color: rgba(255,255,255,0.8);
            display: flex; align-items: center; justify-content: center;
            font-size: 24px; font-weight: bold; cursor: not-allowed;
            position: relative; user-select: none; transition: background 0.1s;
        }
        /* 准备状态 (提前变蓝) */
        .hit-btn.ready { background: var(--ready-color); cursor: pointer; color: white; }
        /* 正式演奏状态 */
        .hit-btn.play { background: var(--play-color); cursor: pointer; color: white; }
        .hit-btn.active:active, .hit-btn.ready:active, .hit-btn.play:active { background: #0D47A1; }
        
        .hit-btn.success { background: var(--success-color); color: white; }
        .hit-btn.fail { background: var(--fail-color); color: white; animation: shake 0.4s; }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-10px); }
            40%, 80% { transform: translateX(10px); }
        }

        .overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255,255,255,0.98); z-index: 999;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
        }
        .start-btn {
            margin-top: 30px; padding: 15px 60px;
            font-size: 20px; font-weight: bold;
            background: var(--primary-blue); color: white;
            border: none; border-radius: 50px; cursor: pointer;
        }
    </style>
</head>
<body>

<div class="game-wrapper">
    <div class="header">
        <h1>🍜 拉面节奏 (Pre-entry版)</h1>
        <div class="bpm-ctrl">
            <span>BPM</span>
            <input type="range" id="bpm-range" min="40" max="100" value="60"> 
            <span id="bpm-val">60</span>
        </div>
    </div>

    <div class="phase-bar listen" id="phase-bar">👀 听题</div>

    <div class="score-section" id="score-section">
        <div class="staff-lines"></div>
        <div class="time-signature"><span>2</span><span>4</span></div>
        <div class="note-display" id="note-display"></div>
    </div>

    <div class="main-stage">
        <svg class="rhythm-svg dim" id="rhythm-circle" viewBox="0 0 100 100">
            <circle cx="50" cy="50" r="48" fill="none" stroke="#ddd" stroke-width="2" />
            <g id="sectors-group"></g>
        </svg>

        <div class="noodle-area">
            <div class="noodle-viz" id="noodle-viz">
                <div class="hand l">👊</div>
                <div class="dough" id="dough"></div>
                <div class="hand r">👊</div>
            </div>
        </div>
    </div>

    <div class="hit-btn" id="hit-btn">
        等待...
    </div>

    <div class="overlay" id="overlay">
        <h1>节奏卡点挑战</h1>
        <p style="color:#666; margin:10px 0;">蓝色亮起即可操作 (抢拍判定)</p>
        <button class="start-btn" id="start-btn">开始</button>
    </div>
</div>

<script>
    // --- 题目定义 ---
    const patterns = [
        { 
            id: 1, name: "二分", 
            angles: [360], 
            draw: (el) => drawNotes(el, ['half']),
            timing: [0.0] 
        },
        { 
            id: 2, name: "1/4 + 1/4", 
            angles: [180, 180], 
            draw: (el) => drawNotes(el, ['quarter', 'quarter']),
            timing: [0.0, 1.0]
        },
        { 
            id: 3, name: "1/4 + 1/8 + 1/8", 
            angles: [180, 90, 90], 
            draw: (el) => drawNotes(el, ['quarter', 'eighth_pair']),
            timing: [0.0, 1.0, 1.5]
        },
        { 
            id: 4, name: "1/8 + 1/8 + 1/4", 
            angles: [90, 90, 180], 
            draw: (el) => drawNotes(el, ['eighth_pair', 'quarter']),
            timing: [0.0, 0.5, 1.0]
        },
        { 
            id: 5, name: "1/8 * 4", 
            angles: [90, 90, 90, 90], 
            draw: (el) => drawNotes(el, ['eighth_pair', 'eighth_pair']),
            timing: [0.0, 0.5, 1.0, 1.5]
        },
        { 
            id: 6, name: "三连音", 
            angles: [120, 120, 120], 
            draw: (el) => drawNotes(el, ['triplet']),
            timing: [0.0, 0.66, 1.33] 
        }
    ];

    let config = { bpm: 60, tolerance: 0.2 }; // 固定 0.2秒 容错
    let state = {
        ctx: null,
        isPlaying: false,
        nextMeasureTime: 0, 
        
        // 0: Listen (Beat 1 of measure 1)
        // 1: Ready/Pre-entry (Beat 2 of measure 1)
        // 2: Play Start (Beat 1 of measure 2)
        // 3: Play Cont (Beat 2 of measure 2)
        beatCounter: 0, 
        
        currentPattern: null,
        tapIndex: 0,
        canPlay: false,
        playPhaseStartTime: 0 // 演奏阶段(第3拍)的理论开始时间
    };

    // --- DOM ---
    const ui = {
        svgGroup: document.getElementById('sectors-group'),
        noteDisplay: document.getElementById('note-display'),
        hitBtn: document.getElementById('hit-btn'),
        overlay: document.getElementById('overlay'),
        noodleViz: document.getElementById('noodle-viz'),
        dough: document.getElementById('dough'),
        phaseBar: document.getElementById('phase-bar'),
        scoreSection: document.getElementById('score-section')
    };

    // --- 音频引擎 ---
    function initAudio() {
        const AC = window.AudioContext || window.webkitAudioContext;
        if(AC) { state.ctx = new AC(); if(state.ctx.state === 'suspended') state.ctx.resume(); }
    }

    function playSound(type) {
        if(!state.ctx) return;
        const t = state.ctx.currentTime;
        const osc = state.ctx.createOscillator();
        const gain = state.ctx.createGain();

        if (type === 'beat_listen') { osc.frequency.value = 1000; gain.gain.value = 0.3; }
        else if (type === 'beat_go') { osc.frequency.value = 600; gain.gain.value = 0.5; }
        else if (type === 'beat_sub') { osc.frequency.value = 800; gain.gain.value = 0.2; }
        else if (type === 'tap') { osc.frequency.value = 400; gain.gain.value = 0.6; }
        else if (type === 'success') { osc.frequency.value = 880; gain.gain.value = 0.3; osc.type = 'triangle'; }
        else if (type === 'fail') { osc.frequency.value = 150; gain.gain.value = 0.8; osc.type = 'sawtooth'; }

        gain.gain.exponentialRampToValueAtTime(0.01, t + (type==='fail'?0.3:0.1));
        osc.connect(gain); gain.connect(state.ctx.destination);
        osc.start(t); osc.stop(t + 0.3);
    }

    // --- 游戏循环 ---
    function schedule() {
        if (!state.isPlaying) return;
        const currentTime = state.ctx ? state.ctx.currentTime : (Date.now()/1000);
        const lookahead = 0.1;
        const secondsPerBeat = 60.0 / config.bpm;

        if (state.nextMeasureTime < currentTime + lookahead) {
            runBeat(state.nextMeasureTime);
            state.nextMeasureTime += secondsPerBeat;
        }
        requestAnimationFrame(schedule);
    }

    function runBeat(time) {
        const audioTime = state.ctx ? state.ctx.currentTime : (Date.now()/1000);
        const delay = (time - audioTime) * 1000;
        const secondsPerBeat = 60.0 / config.bpm;

        setTimeout(() => {
            // beatCounter: 0(Listen), 1(Ready), 2(Play), 3(Play)
            
            if (state.beatCounter === 0) {
                // === PHASE 1: LISTEN ===
                playSound('beat_listen');
                pickNewPattern();
                setPhase('listen');
            } 
            else if (state.beatCounter === 1) {
                // === PHASE 2: PRE-ENTRY (READY) ===
                playSound('beat_sub');
                // 在这一拍开始时，按钮就变蓝解锁
                setPhase('ready');
                // 预测下一拍(Beat 2)的准确时间作为基准
                // 注意：这里的 time 是当前 Beat 1 的时间
                state.playPhaseStartTime = time + secondsPerBeat;
            }
            else if (state.beatCounter === 2) {
                // === PHASE 3: PLAY START (TARGET) ===
                playSound('beat_go');
                setPhase('play'); // 保持蓝色，更新文字
            }
            else if (state.beatCounter === 3) {
                playSound('beat_sub');
            }

            state.beatCounter = (state.beatCounter + 1) % 4;
        }, delay > 0 ? delay : 0);
    }

    // --- 状态管理 ---
    function setPhase(phase) {
        if (phase === 'listen') {
            state.canPlay = false;
            ui.phaseBar.textContent = "👀 听题";
            ui.phaseBar.className = "phase-bar listen";
            ui.hitBtn.textContent = "等待...";
            ui.hitBtn.className = "hit-btn"; // 灰
            ui.scoreSection.classList.add('listening');
            resetVisuals();
            state.tapIndex = 0;
            // 恢复面条
            ui.noodleViz.classList.remove('broken');
            ui.noodleViz.classList.remove('pulling');
            ui.dough.style.opacity = '1';
        } 
        else if (phase === 'ready') {
            state.canPlay = true; // 解锁！
            ui.phaseBar.textContent = "💪 准备...";
            ui.phaseBar.className = "phase-bar ready";
            ui.hitBtn.textContent = "TAP (可抢拍)";
            ui.hitBtn.className = "hit-btn ready"; // 浅蓝
            ui.scoreSection.classList.remove('listening');
        }
        else if (phase === 'play') {
            // 已经是 true 了，这里只是视觉变化
            ui.phaseBar.textContent = "👋 演奏!";
            ui.phaseBar.className = "phase-bar play";
            ui.hitBtn.textContent = "TAP 演奏";
            ui.hitBtn.className = "hit-btn play"; // 深蓝
        }
    }

    function pickNewPattern() {
        const idx = Math.floor(Math.random() * patterns.length);
        state.currentPattern = patterns[idx];
        state.currentPattern.draw(ui.noteDisplay);
        drawSectors(state.currentPattern.angles);
    }

    // --- 核心：判定逻辑 (±0.2s) ---
    function handleInput(e) {
        if(e) e.preventDefault();
        
        // 没到 Ready/Play 阶段不能点
        if (!state.isPlaying || !state.canPlay) {
            ui.hitBtn.classList.add('shake');
            setTimeout(()=>ui.hitBtn.classList.remove('shake'), 300);
            return;
        }

        ui.hitBtn.classList.add('pressed');
        setTimeout(()=>ui.hitBtn.classList.remove('pressed'), 80);

        // 获取当前点击的时间差
        const audioTime = state.ctx ? state.ctx.currentTime : (Date.now()/1000);
        // 时间基准：当前时间 - 理论上的开始时间(Beat 2)
        // 注意：如果在 Pre-entry 阶段(Beat 1)点击，timeSinceStart 会是负数，这没关系
        const timeSinceStart = audioTime - state.playPhaseStartTime;
        const secondsPerBeat = 60.0 / config.bpm;

        // 获取当前音符的理论时间点 (相对于 Beat 2)
        const expectedBeats = state.currentPattern.timing[state.tapIndex];
        const expectedTime = expectedBeats * secondsPerBeat;

        // 计算误差绝对值
        const diff = Math.abs(timeSinceStart - expectedTime);

        console.log(`Tap ${state.tapIndex}: Diff=${diff.toFixed(3)}s (Tol=${config.tolerance})`);

        if (diff <= config.tolerance) {
            // Success
            handleSuccess();
        } else {
            // Fail
            handleFail();
        }
    }

    function handleSuccess() {
        playSound('tap');
        const sector = document.getElementById(`sec-${state.tapIndex}`);
        if (sector) sector.classList.add('filled');

        state.tapIndex++;

        if (state.tapIndex >= state.currentPattern.angles.length) {
            finishMeasure(true);
        }
    }

    function handleFail() {
        playSound('fail');
        finishMeasure(false);
    }

    function finishMeasure(success) {
        state.canPlay = false; // 锁定直到下一轮
        
        if (success) {
            ui.hitBtn.className = "hit-btn success";
            ui.hitBtn.textContent = "✅";
            ui.phaseBar.textContent = "✅ 完美";
            ui.phaseBar.className = "phase-bar done";
            ui.noodleViz.classList.add('pulling');
        } else {
            ui.hitBtn.className = "hit-btn fail";
            ui.hitBtn.textContent = "❌";
            ui.phaseBar.textContent = "❌ 节奏错误";
            ui.phaseBar.className = "phase-bar fail";
            ui.noodleViz.classList.add('broken');
        }
    }

    // --- 辅助绘制 ---
    function drawNotes(container, types) {
        container.innerHTML = '';
        let svgHtml = `<svg width="200" height="80" viewBox="0 0 200 80">`;
        let x = 10;
        types.forEach(type => {
            if (type === 'half') {
                svgHtml += `<ellipse cx="${x+15}" cy="55" rx="8" ry="6" fill="none" stroke="black" stroke-width="2" transform="rotate(-20 ${x+15} 55)"/>`;
                svgHtml += `<line x1="${x+22}" y1="55" x2="${x+22}" y2="15" stroke="black" stroke-width="2"/>`; x += 60;
            } else if (type === 'quarter') {
                svgHtml += `<ellipse cx="${x+15}" cy="55" rx="8" ry="6" fill="black" transform="rotate(-20 ${x+15} 55)"/>`;
                svgHtml += `<line x1="${x+22}" y1="55" x2="${x+22}" y2="15" stroke="black" stroke-width="2"/>`; x += 50;
            } else if (type === 'eighth_pair') {
                svgHtml += `<ellipse cx="${x+10}" cy="55" rx="8" ry="6" fill="black" transform="rotate(-20 ${x+10} 55)"/>`;
                svgHtml += `<line x1="${x+17}" y1="55" x2="${x+17}" y2="15" stroke="black" stroke-width="2"/>`;
                svgHtml += `<ellipse cx="${x+45}" cy="55" rx="8" ry="6" fill="black" transform="rotate(-20 ${x+45} 55)"/>`;
                svgHtml += `<line x1="${x+52}" y1="55" x2="${x+52}" y2="15" stroke="black" stroke-width="2"/>`;
                svgHtml += `<line x1="${x+17}" y1="15" x2="${x+52}" y2="15" stroke="black" stroke-width="5"/>`; x += 70;
            } else if (type === 'triplet') {
                svgHtml += `<ellipse cx="${x+10}" cy="55" rx="8" ry="6" fill="black" transform="rotate(-20 ${x+10} 55)"/>`;
                svgHtml += `<line x1="${x+17}" y1="55" x2="${x+17}" y2="15" stroke="black" stroke-width="2"/>`;
                svgHtml += `<ellipse cx="${x+40}" cy="55" rx="8" ry="6" fill="black" transform="rotate(-20 ${x+40} 55)"/>`;
                svgHtml += `<line x1="${x+47}" y1="55" x2="${x+47}" y2="15" stroke="black" stroke-width="2"/>`;
                svgHtml += `<ellipse cx="${x+70}" cy="55" rx="8" ry="6" fill="black" transform="rotate(-20 ${x+70} 55)"/>`;
                svgHtml += `<line x1="${x+77}" y1="55" x2="${x+77}" y2="15" stroke="black" stroke-width="2"/>`;
                svgHtml += `<line x1="${x+17}" y1="15" x2="${x+77}" y2="15" stroke="black" stroke-width="5"/>`;
                svgHtml += `<text x="${x+47}" y="10" font-size="14" text-anchor="middle" font-style="italic">3</text>`; x += 90;
            }
        });
        svgHtml += `</svg>`;
        container.innerHTML = svgHtml;
    }
    
    function drawSectors(angles) {
        ui.svgGroup.innerHTML = '';
        const radius = 48; const center = 50;
        let currentAngle = -90;
        angles.forEach((angle, i) => {
            const startRad = Math.PI * currentAngle / 180;
            const endRad = Math.PI * (currentAngle + angle) / 180;
            const x1 = center + radius * Math.cos(startRad);
            const y1 = center + radius * Math.sin(startRad);
            const x2 = center + radius * Math.cos(endRad);
            const y2 = center + radius * Math.sin(endRad);
            const largeArc = angle > 180 ? 1 : 0;
            const d = `M${center},${center} L${x1},${y1} A${radius},${radius} 0 ${largeArc},1 ${x2},${y2} Z`;
            const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
            path.setAttribute("d", d); path.setAttribute("class", "sector"); path.setAttribute("id", `sec-${i}`);
            ui.svgGroup.appendChild(path);
            if (angles.length > 1) {
                const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
                line.setAttribute("x1", center); line.setAttribute("y1", center);
                line.setAttribute("x2", x1); line.setAttribute("y2", y1);
                line.setAttribute("class", "border-line");
                ui.svgGroup.appendChild(line);
            }
            currentAngle += angle;
        });
    }

    function resetVisuals() {
        document.querySelectorAll('.sector').forEach(s => s.classList.remove('filled'));
    }

    // --- 启动 ---
    document.getElementById('start-btn').addEventListener('click', () => {
        initAudio();
        ui.overlay.style.display = 'none';
        state.isPlaying = true;
        state.beatCounter = 0;
        state.nextMeasureTime = (state.ctx ? state.ctx.currentTime : (Date.now()/1000)) + 0.5;
        schedule();
    });

    document.getElementById('bpm-range').addEventListener('input', (e) => {
        config.bpm = parseInt(e.target.value);
        document.getElementById('bpm-val').textContent = config.bpm;
    });

    ui.hitBtn.addEventListener('touchstart', handleInput, {passive: false});
    ui.hitBtn.addEventListener('mousedown', handleInput);

</script>
</body>
</html>
