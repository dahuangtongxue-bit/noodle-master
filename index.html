<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>拉面大师 - 60秒最终版</title>
    <style>
        :root {
            --primary-blue: #104e8b;
            --bg-color: #fdfdfd;
            --active-color: #ffaa00;
            --ready-color: #2979FF; 
            --play-color: #1565C0;  
            --success-color: #4CAF50;
            --fail-color: #F44336;
            --star-color: #FFC107;
        }

        html, body {
            margin: 0; padding: 0; width: 100%; height: 100%;
            overflow: hidden; background-color: var(--bg-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            touch-action: none; user-select: none; -webkit-user-select: none;
        }

        .game-wrapper {
            display: flex; flex-direction: column; width: 100%; height: 100%;
        }

        /* HUD */
        .hud-header {
            flex: 0 0 70px; display: flex; justify-content: space-between; align-items: center;
            padding: 0 20px; background: #fff; border-bottom: 2px solid #eee; z-index: 10;
        }
        .hud-item { display: flex; flex-direction: column; align-items: center; }
        .hud-label { font-size: 10px; color: #999; letter-spacing: 1px; }
        .hud-value { font-size: 24px; font-weight: 800; color: #333; font-variant-numeric: tabular-nums; }
        .hud-value.rating { color: var(--star-color); display: flex; align-items: center; gap: 5px; }
        .star-icon { font-size: 20px; }

        .progress-bar-container { width: 100%; height: 4px; background: #eee; }
        .progress-bar { width: 0%; height: 100%; background: var(--primary-blue); transition: width 1s linear; }

        /* Phase Bar */
        .phase-bar {
            height: 30px; display: flex; align-items: center; justify-content: center;
            font-weight: bold; font-size: 14px; color: white; letter-spacing: 1px;
            transition: background 0.1s;
        }
        .phase-bar.listen { background: #9E9E9E; }
        .phase-bar.ready { background: var(--ready-color); }
        .phase-bar.play { background: var(--play-color); }
        .phase-bar.done { background: var(--success-color); }
        .phase-bar.fail { background: var(--fail-color); }

        /* Score Section */
        .score-section {
            flex: 0 0 130px; background: #fff; position: relative;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            border-bottom: 1px solid #f0f0f0; transition: background 0.2s;
        }
        .score-section.listening { background: #f9f9f9; }
        
        .order-text {
            font-size: 20px; font-weight: 900; color: #333; margin-bottom: 5px;
            background: #FFECB3; padding: 4px 15px; border-radius: 20px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1); transform: translateY(-5px);
        }

        .staff-wrapper { position: relative; width: 100%; height: 70px; display: flex; justify-content: center; }
        .staff-lines {
            position: absolute; width: 80%; height: 60px; left: 10%;
            background-image: repeating-linear-gradient(0deg, #333, #333 1px, transparent 1px, transparent 14px);
            background-size: 100% 15px; top: 10px; z-index: 0;
        }
        .time-signature {
            position: absolute; left: 12%; top: 10px; z-index: 1;
            font-family: 'Times New Roman', serif; font-weight: bold; font-size: 36px; line-height: 0.8;
            display: flex; flex-direction: column; align-items: center; color: #000;
        }
        .note-display {
            z-index: 2; display: flex; align-items: center; gap: 15px;
            margin-left: 60px; transform: translateY(-15px);
        }

        /* Main Stage */
        .main-stage {
            flex: 1; display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            position: relative; width: 100%;
        }

        /* Combo & Bonus UI */
        .combo-container {
            position: absolute; right: 20px; top: 20px;
            text-align: right; pointer-events: none; z-index: 5;
            display: flex; flex-direction: column; align-items: flex-end;
        }
        .combo-label { font-size: 12px; color: #999; font-weight: bold; letter-spacing: 2px; }
        .combo-value { 
            font-size: 48px; font-weight: 900; color: #ddd; 
            line-height: 1; transition: transform 0.1s, color 0.1s; 
        }
        .combo-value.active { color: var(--active-color); }
        .combo-value.pop { transform: scale(1.3); }
        
        .combo-bonus {
            font-size: 18px; font-weight: bold; color: var(--success-color);
            opacity: 0; transform: translateY(10px); transition: all 0.2s;
        }
        .combo-bonus.show { opacity: 1; transform: translateY(0); }

        .rhythm-svg {
            width: 55vw; height: 55vw; max-width: 240px; max-height: 240px;
            margin-bottom: 10px; transition: opacity 0.2s; z-index: 1;
        }
        .rhythm-svg.dim { opacity: 0.3; }
        
        .sector { fill: #fff; stroke: #ccc; stroke-width: 2; transition: fill 0.05s; }
        .sector.filled { fill: var(--active-color); stroke: var(--active-color); }
        .border-line { stroke: #fff; stroke-width: 3; }

        .noodle-area { height: 80px; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .noodle-viz { display: flex; align-items: center; gap: 10px; position: relative; }
        .hand { font-size: 24px; transition: transform 0.1s; }
        .hand.l { transform: scaleX(-1) rotate(90deg); }
        .hand.r { transform: rotate(90deg) scaleY(-1); }
        
        .dough { 
            width: 100px; height: 10px; background: #eecd86; 
            border: 2px solid #c9a44d; border-radius: 5px; 
            transition: width 0.3s, transform 0.1s, opacity 0.1s;
        }
        .pulling .dough { transform: scaleX(1.4); }
        .pulling .hand.l { transform: translateX(-20px) scaleX(-1) rotate(90deg); }
        .pulling .hand.r { transform: translateX(20px) rotate(90deg) scaleY(-1); }
        .broken .dough { 
            background: #F44336; border-color: #D32F2F; width: 10px; opacity: 0; 
            transform: translateY(20px) rotate(45deg); 
        }

        /* Button */
        .hit-btn {
            flex: 0 0 35%; background: #ccc; 
            color: rgba(255,255,255,0.8);
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            font-size: 24px; font-weight: bold; cursor: not-allowed;
            position: relative; user-select: none; transition: background 0.1s;
        }
        .hit-btn .sub-text { font-size: 14px; font-weight: normal; margin-top: 5px; opacity: 0.9; }
        
        .hit-btn.ready { background: var(--ready-color); cursor: pointer; color: white; }
        .hit-btn.play { background: var(--play-color); cursor: pointer; color: white; }
        .hit-btn.success { background: var(--success-color); color: white; }
        .hit-btn.fail { background: var(--fail-color); color: white; animation: shake 0.4s; }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-10px); }
            40%, 80% { transform: translateX(10px); }
        }

        /* Overlay */
        .overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255,255,255,0.98); z-index: 999;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
        }
        .start-btn {
            margin-top: 30px; padding: 15px 60px;
            font-size: 20px; font-weight: bold;
            background: var(--primary-blue); color: white;
            border: none; border-radius: 50px; cursor: pointer;
            box-shadow: 0 5px 15px rgba(16, 78, 139, 0.3);
        }
        
        /* Float Text */
        .float-text {
            position: absolute; font-weight: bold; font-size: 24px;
            pointer-events: none; animation: floatUp 0.8s forwards; z-index: 100;
        }
        .float-text.plus { color: var(--success-color); }
        .float-text.minus { color: var(--fail-color); }

        @keyframes floatUp {
            0% { opacity: 1; transform: translateY(0); }
            100% { opacity: 0; transform: translateY(-80px); }
        }
        
        /* End Screen Text */
        .ramen-god-text {
            font-size: 40px; font-weight: 900; color: #d32f2f;
            text-shadow: 2px 2px 0 #fff, 0 0 10px rgba(211, 47, 47, 0.5);
            margin-bottom: 5px; animation: zoomIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .ramen-master-text {
            font-size: 20px; font-weight: bold; color: #555;
            font-family: 'Georgia', serif; font-style: italic;
            margin-bottom: 20px; opacity: 0; animation: fadeIn 1s 0.5s forwards;
        }
        @keyframes zoomIn { from {transform: scale(0);} to {transform: scale(1);} }
        @keyframes fadeIn { from {opacity: 0;} to {opacity: 1;} }
    </style>
</head>
<body>

<div class="game-wrapper">
    <div class="hud-header">
        <div class="hud-item">
            <span class="hud-label">时间</span>
            <span class="hud-value" id="time-display">01:00</span>
        </div>
        <div class="hud-item">
            <span class="hud-label">速度</span>
            <div style="display:flex; align-items:center; gap:5px;">
                <input type="range" id="bpm-range" min="40" max="120" value="80" style="width:80px;">
                <span style="font-size:14px; font-weight:bold; color:#333;" id="bpm-val">80</span>
            </div>
        </div>
        <div class="hud-item">
            <span class="hud-label">大众点评</span>
            <div class="hud-value rating">
                <span class="star-icon">⭐</span>
                <span id="rating-display">3.50</span>
            </div>
        </div>
    </div>
    <div class="progress-bar-container"><div class="progress-bar" id="song-progress"></div></div>

    <div class="phase-bar listen" id="phase-bar">👀 听题</div>

    <div class="score-section" id="score-section">
        <div class="order-text" id="order-text">准备开始</div>
        <div class="staff-wrapper">
            <div class="staff-lines"></div>
            <div class="time-signature"><span>2</span><span>4</span></div>
            <div class="note-display" id="note-display"></div>
        </div>
    </div>

    <div class="main-stage">
        <div class="combo-container">
            <div class="combo-label">COMBO</div>
            <div class="combo-value" id="combo-value">0</div>
            <div class="combo-bonus" id="combo-bonus">+0.25</div>
        </div>

        <svg class="rhythm-svg dim" id="rhythm-circle" viewBox="0 0 100 100">
            <circle cx="50" cy="50" r="48" fill="none" stroke="#ddd" stroke-width="2" />
            <g id="sectors-group"></g>
        </svg>

        <div class="noodle-area">
            <div class="noodle-viz" id="noodle-viz">
                <div class="hand l">👊</div>
                <div class="dough" id="dough"></div>
                <div class="hand r">👊</div>
            </div>
        </div>
    </div>

    <div class="hit-btn" id="hit-btn">
        <div>等待...</div>
    </div>

    <div class="overlay" id="overlay">
        <h1>🍜 拉面大师</h1>
        <p style="color:#666; margin:10px 0;">3.5分起步 · 满5分封神</p>
        <button class="start-btn" id="start-btn">开始营业</button>
    </div>
    
    <div class="overlay" id="end-overlay" style="display:none;">
        <div id="end-content" style="text-align:center;"></div>
        <button class="start-btn" id="restart-btn">再次营业</button>
    </div>
</div>

<script>
window.onerror = function(msg) { alert("Error: " + msg); };

// --- 核心配置 ---
const GAME_DURATION = 60; // 60秒
let BPM = 80; 
const TOLERANCE = 0.2; 

// 题目定义
const patterns = [
    { 
        id: 'mian', name: "面", 
        angles: [360], draw: (el) => drawNotes(el, ['whole']), timing: [0.0] 
    },
    { 
        id: 'lamian', name: "拉面", 
        angles: [180, 180], draw: (el) => drawNotes(el, ['quarter', 'quarter']), timing: [0.0, 1.0] 
    },
    { 
        id: 'chilamian', name: "吃拉面", 
        angles: [180, 90, 90], draw: (el) => drawNotes(el, ['quarter', 'eighth_pair']), timing: [0.0, 1.0, 1.5] 
    },
    { 
        id: 'niuroumian', name: "牛肉面", 
        angles: [90, 90, 180], draw: (el) => drawNotes(el, ['eighth_pair', 'quarter']), timing: [0.0, 0.5, 1.0] 
    },
    { 
        id: 'tianpeizi', name: "甜胚子", 
        angles: [120, 120, 120], draw: (el) => drawNotes(el, ['triplet']), timing: [0.0, 0.66, 1.33] 
    },
    { 
        id: 'lanzhou', name: "兰州拉面", 
        angles: [90, 90, 90, 90], draw: (el) => drawNotes(el, ['eighth_pair', 'eighth_pair']), timing: [0.0, 0.5, 1.0, 1.5] 
    },
    { 
        id: 'shifu', name: "师傅，下个细滴", 
        angles: [90, 90, 45, 45, 45, 45], draw: (el) => drawNotes(el, ['eighth_pair', 'sixteenth_quad']), 
        timing: [0.0, 0.5, 1.0, 1.25, 1.5, 1.75] 
    }
];

let state = {
    ctx: null, isPlaying: false,
    gameStartTime: 0, nextMeasureTime: 0,
    beatCounter: 0, currentPattern: null,
    tapIndex: 0, canPlay: false, playPhaseStartTime: 0,
    rating: 3.5, currentCombo: 0, maxCombo: 0
};

const ui = {
    ratingDisplay: document.getElementById('rating-display'),
    timeDisplay: document.getElementById('time-display'),
    comboValue: document.getElementById('combo-value'),
    comboBonus: document.getElementById('combo-bonus'),
    orderText: document.getElementById('order-text'),
    progressBar: document.getElementById('song-progress'),
    svgGroup: document.getElementById('sectors-group'),
    noteDisplay: document.getElementById('note-display'),
    hitBtn: document.getElementById('hit-btn'),
    noodleViz: document.getElementById('noodle-viz'),
    dough: document.getElementById('dough'),
    phaseBar: document.getElementById('phase-bar'),
    scoreSection: document.getElementById('score-section'),
    circle: document.getElementById('rhythm-circle'),
    overlay: document.getElementById('overlay'),
    endOverlay: document.getElementById('end-overlay'),
    endContent: document.getElementById('end-content'),
    restartBtn: document.getElementById('restart-btn'),
    startBtn: document.getElementById('start-btn'),
    bpmRange: document.getElementById('bpm-range'),
    bpmVal: document.getElementById('bpm-val')
};

// --- Audio ---
function initAudio() {
    try {
        const AC = window.AudioContext || window.webkitAudioContext;
        if(!AC) return;
        state.ctx = new AC();
        const buffer = state.ctx.createBuffer(1, 1, 22050);
        const source = state.ctx.createBufferSource();
        source.buffer = buffer; source.connect(state.ctx.destination);
        source.start(0);
        if(state.ctx.state === 'suspended') state.ctx.resume();
    } catch(e) { console.error(e); }
}

function playVocal(time) {
    if(!state.ctx) return;
    const t = time || state.ctx.currentTime;
    const osc = state.ctx.createOscillator();
    const gain = state.ctx.createGain();
    const filter = state.ctx.createBiquadFilter();
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(450, t); 
    osc.frequency.exponentialRampToValueAtTime(300, t + 0.1);
    filter.type = 'lowpass'; filter.frequency.setValueAtTime(1200, t);
    gain.gain.setValueAtTime(0.4, t);
    gain.gain.exponentialRampToValueAtTime(0.001, t + 0.15);
    osc.connect(filter); filter.connect(gain); gain.connect(state.ctx.destination);
    osc.start(t); osc.stop(t + 0.2);
}

function playTone(freq, type, duration, vol, time) {
    if(!state.ctx) return;
    const t = time || state.ctx.currentTime;
    const osc = state.ctx.createOscillator();
    const gain = state.ctx.createGain();
    osc.frequency.value = freq; osc.type = type;
    gain.gain.setValueAtTime(vol, t);
    gain.gain.exponentialRampToValueAtTime(0.001, t + duration);
    osc.connect(gain); gain.connect(state.ctx.destination);
    osc.start(t); osc.stop(t + duration + 0.1);
}

// --- Loop ---
function schedule() {
    if (!state.isPlaying) return;
    if(state.ctx && state.ctx.state === 'suspended') state.ctx.resume();
    
    const currentTime = state.ctx ? state.ctx.currentTime : (Date.now()/1000);
    const elapsed = currentTime - state.gameStartTime;
    if (elapsed >= GAME_DURATION) { endGame(false); return; }
    updateTimeUI(elapsed);
    
    const lookahead = 0.1;
    const secondsPerBeat = 60.0 / BPM;

    if (state.nextMeasureTime < currentTime + lookahead) {
        runBeat(state.nextMeasureTime);
        state.nextMeasureTime += secondsPerBeat;
    }
    requestAnimationFrame(schedule);
}

function runBeat(time) {
    const audioTime = state.ctx ? state.ctx.currentTime : (Date.now()/1000);
    const delay = (time - audioTime) * 1000;
    const secondsPerBeat = 60.0 / BPM;

    setTimeout(() => {
        if (!state.isPlaying) return;
        if (state.beatCounter === 0) {
            playTone(1000, 'square', 0.05, 0.1); 
            pickNewPattern();
            setPhase('listen');
            if (state.currentPattern) {
                state.currentPattern.timing.forEach(t => {
                    playVocal(state.ctx.currentTime + (t * secondsPerBeat));
                });
            }
        } 
        else if (state.beatCounter === 1) {
            playTone(800, 'square', 0.05, 0.1); 
            setPhase('ready'); 
            state.playPhaseStartTime = state.ctx.currentTime + secondsPerBeat;
        }
        else if (state.beatCounter === 2) {
            playTone(1000, 'square', 0.05, 0.2); 
            ui.phaseBar.textContent = "👋 演奏中";
            ui.phaseBar.className = "phase-bar play";
        }
        else if (state.beatCounter === 3) {
            playTone(800, 'square', 0.05, 0.1); 
        }
        state.beatCounter = (state.beatCounter + 1) % 4;
    }, delay > 0 ? delay : 0);
}

function setPhase(phase) {
    if (phase === 'listen') {
        state.canPlay = false;
        ui.phaseBar.textContent = "👂 听题";
        ui.phaseBar.className = "phase-bar listen";
        ui.hitBtn.innerHTML = `<div>等待...</div>`;
        ui.hitBtn.className = "hit-btn"; 
        ui.scoreSection.classList.add('listening');
        ui.circle.classList.add('dim');
        resetVisuals();
        state.tapIndex = 0;
        ui.noodleViz.classList.remove('broken');
        ui.noodleViz.classList.remove('pulling');
        ui.dough.style.opacity = '1';
        ui.comboBonus.classList.remove('show');
    } 
    else if (phase === 'ready') {
        state.canPlay = true; 
        ui.phaseBar.textContent = "💪 准备 (可抢拍)";
        ui.phaseBar.className = "phase-bar ready";
        ui.hitBtn.innerHTML = `<div>TAP</div><div class='sub-text'>可抢拍</div>`;
        ui.hitBtn.className = "hit-btn ready"; 
        ui.scoreSection.classList.remove('listening');
        ui.circle.classList.remove('dim');
    }
}

// --- Logic ---
function updateRating(delta) {
    state.rating += delta;
    state.rating = Math.max(0, Math.min(5, state.rating));
    ui.ratingDisplay.textContent = state.rating.toFixed(2);
    
    const rect = ui.ratingDisplay.getBoundingClientRect();
    const text = delta > 0 ? `+${delta.toFixed(3)}` : `${delta.toFixed(2)}`;
    const type = delta > 0 ? "plus" : "minus";
    showFloatText(text, type, rect.left + 50, rect.top + 30);

    if (state.rating >= 5.0) {
        setTimeout(() => endGame(true), 500);
    }
}

function addCombo() {
    state.currentCombo++;
    if (state.currentCombo > state.maxCombo) state.maxCombo = state.currentCombo;
    
    // Updated Logic
    let bonus = state.currentCombo > 10 ? 0.05 : 0.025;
    
    ui.comboValue.textContent = state.currentCombo;
    ui.comboValue.className = "combo-value active pop";
    
    ui.comboBonus.textContent = `+${bonus}`;
    ui.comboBonus.className = "combo-bonus show";
    
    setTimeout(() => ui.comboValue.className = "combo-value active", 100);
    
    // Base score + Combo Bonus
    updateRating(0.05 + bonus); 
}

function resetCombo() {
    state.currentCombo = 0;
    ui.comboValue.textContent = "0";
    ui.comboValue.className = "combo-value";
    ui.comboBonus.className = "combo-bonus"; 
    updateRating(-0.05);
}

function showFloatText(text, type, x, y) {
    const el = document.createElement('div');
    el.className = `float-text ${type}`;
    el.textContent = text;
    el.style.left = x + 'px'; el.style.top = y + 'px';
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 1000);
}

function handleInput(e) {
    if(e) e.preventDefault();
    if (!state.isPlaying || !state.canPlay) {
        ui.hitBtn.classList.add('shake');
        setTimeout(()=>ui.hitBtn.classList.remove('shake'), 300); return;
    }
    ui.hitBtn.classList.add('pressed');
    setTimeout(()=>ui.hitBtn.classList.remove('pressed'), 80);

    const audioTime = state.ctx ? state.ctx.currentTime : (Date.now()/1000);
    const timeSinceStart = audioTime - state.playPhaseStartTime;
    const secondsPerBeat = 60.0 / BPM;
    const expectedBeats = state.currentPattern.timing[state.tapIndex];
    const expectedTime = expectedBeats * secondsPerBeat;
    const diff = Math.abs(timeSinceStart - expectedTime);

    if (diff <= TOLERANCE) {
        playTone(600, 'sine', 0.05, 0.5); 
        const sector = document.getElementById(`sec-${state.tapIndex}`);
        if (sector) sector.classList.add('filled');
        state.tapIndex++;
        if (state.tapIndex >= state.currentPattern.angles.length) {
            finishMeasure(true);
        }
    } else {
        handleFail();
    }
}

function handleFail() {
    playTone(150, 'sawtooth', 0.3, 0.6); 
    finishMeasure(false);
}

function finishMeasure(success) {
    state.canPlay = false; 
    if (success) {
        ui.hitBtn.className = "hit-btn success";
        ui.hitBtn.innerHTML = `<div>✅ 完美</div>`;
        ui.phaseBar.textContent = "✅ 完成";
        ui.phaseBar.className = "phase-bar done";
        ui.noodleViz.classList.add('pulling');
        addCombo();
    } else {
        ui.hitBtn.className = "hit-btn fail";
        ui.hitBtn.innerHTML = `<div>❌ 节奏错误</div>`;
        ui.phaseBar.textContent = "❌ 失败";
        ui.phaseBar.className = "phase-bar fail";
        ui.noodleViz.classList.add('broken');
        resetCombo();
    }
}

function startGame() {
    ui.overlay.style.display = 'none';
    ui.endOverlay.style.display = 'none';
    initAudio();
    state.rating = 3.5; ui.ratingDisplay.textContent = "3.50";
    state.currentCombo = 0; state.maxCombo = 0; ui.comboValue.textContent = "0";
    state.isPlaying = true;
    state.gameStartTime = state.ctx ? state.ctx.currentTime : (Date.now()/1000);
    state.nextMeasureTime = state.gameStartTime + 0.5;
    state.beatCounter = 0;
    schedule();
}

function endGame(isWin) {
    state.isPlaying = false;
    ui.endOverlay.style.display = 'flex';
    
    if (isWin) {
        ui.endContent.innerHTML = `
            <div class="ramen-god-text">你就是拉面之神！</div>
            <div class="ramen-master-text">You are the Ramen Master!</div>
            <div style="font-size:14px; color:#666; margin-bottom:20px;">
                满分通关 | 最大连击: ${state.maxCombo}
            </div>
        `;
    } else {
        ui.endContent.innerHTML = `
            <h1 style="color:#666; margin:0 0 10px 0;">😴 打烊了</h1>
            <p style="color:#999; margin:0;">最终评分</p>
            <div style="font-size:48px; font-weight:bold; color:var(--star-color);">
                ⭐ ${state.rating.toFixed(2)}
            </div>
            <div style="font-size:14px; color:#999; margin:10px 0 20px 0;">
                最大连击: ${state.maxCombo}
            </div>
        `;
    }
}

function pickNewPattern() {
    const idx = Math.floor(Math.random() * patterns.length);
    state.currentPattern = patterns[idx];
    ui.orderText.textContent = `${state.currentPattern.name}`;
    state.currentPattern.draw(ui.noteDisplay);
    drawSectors(state.currentPattern.angles);
}

function updateTimeUI(elapsed) {
    const remaining = Math.max(0, GAME_DURATION - elapsed);
    const mins = Math.floor(remaining / 60);
    const secs = Math.floor(remaining % 60);
    ui.timeDisplay.textContent = `${mins}:${secs.toString().padStart(2, '0')}`;
    ui.progressBar.style.width = `${(elapsed / GAME_DURATION) * 100}%`;
}

function drawNotes(container, types) {
    container.innerHTML = '';
    let svgHtml = `<svg width="240" height="80" viewBox="0 0 240 80">`;
    let x = 10;
    types.forEach(type => {
        if (type === 'whole') {
            svgHtml += `<ellipse cx="${x+20}" cy="55" rx="10" ry="7" fill="none" stroke="black" stroke-width="2" transform="rotate(-20 ${x+20} 55)"/>`; x += 80;
        } else if (type === 'quarter') {
            svgHtml += `<ellipse cx="${x+15}" cy="55" rx="8" ry="6" fill="black" transform="rotate(-20 ${x+15} 55)"/>`;
            svgHtml += `<line x1="${x+22}" y1="55" x2="${x+22}" y2="15" stroke="black" stroke-width="2"/>`; x += 50;
        } else if (type === 'eighth_pair') {
            svgHtml += `<ellipse cx="${x+10}" cy="55" rx="8" ry="6" fill="black" transform="rotate(-20 ${x+10} 55)"/>`;
            svgHtml += `<line x1="${x+17}" y1="55" x2="${x+17}" y2="15" stroke="black" stroke-width="2"/>`;
            svgHtml += `<ellipse cx="${x+45}" cy="55" rx="8" ry="6" fill="black" transform="rotate(-20 ${x+45} 55)"/>`;
            svgHtml += `<line x1="${x+52}" y1="55" x2="${x+52}" y2="15" stroke="black" stroke-width="2"/>`;
            svgHtml += `<line x1="${x+17}" y1="15" x2="${x+52}" y2="15" stroke="black" stroke-width="5"/>`; x += 70;
        } else if (type === 'triplet') {
            svgHtml += `<ellipse cx="${x+10}" cy="55" rx="8" ry="6" fill="black" transform="rotate(-20 ${x+10} 55)"/>`;
            svgHtml += `<line x1="${x+17}" y1="55" x2="${x+17}" y2="15" stroke="black" stroke-width="2"/>`;
            svgHtml += `<ellipse cx="${x+40}" cy="55" rx="8" ry="6" fill="black" transform="rotate(-20 ${x+40} 55)"/>`;
            svgHtml += `<line x1="${x+47}" y1="55" x2="${x+47}" y2="15" stroke="black" stroke-width="2"/>`;
            svgHtml += `<ellipse cx="${x+70}" cy="55" rx="8" ry="6" fill="black" transform="rotate(-20 ${x+70} 55)"/>`;
            svgHtml += `<line x1="${x+77}" y1="55" x2="${x+77}" y2="15" stroke="black" stroke-width="2"/>`;
            svgHtml += `<line x1="${x+17}" y1="15" x2="${x+77}" y2="15" stroke="black" stroke-width="5"/>`;
            svgHtml += `<text x="${x+47}" y="10" font-size="14" text-anchor="middle" font-style="italic">3</text>`; x += 90;
        } else if (type === 'sixteenth_quad') {
            for(let i=0; i<4; i++) {
                let k = x + 10 + (i*25);
                svgHtml += `<ellipse cx="${k}" cy="55" rx="7" ry="5" fill="black" transform="rotate(-20 ${k} 55)"/>`;
                svgHtml += `<line x1="${k+7}" y1="55" x2="${k+7}" y2="15" stroke="black" stroke-width="2"/>`;
            }
            svgHtml += `<line x1="${x+17}" y1="15" x2="${x+10+75+7}" y2="15" stroke="black" stroke-width="4"/>`;
            svgHtml += `<line x1="${x+17}" y1="25" x2="${x+10+75+7}" y2="25" stroke="black" stroke-width="4"/>`;
            x += 110;
        }
    });
    svgHtml += `</svg>`;
    container.innerHTML = svgHtml;
}

function drawSectors(angles) {
    ui.svgGroup.innerHTML = '';
    const radius = 48; const center = 50;
    let currentAngle = -90;
    angles.forEach((angle, i) => {
        const startRad = Math.PI * currentAngle / 180;
        const endRad = Math.PI * (currentAngle + angle) / 180;
        const x1 = center + radius * Math.cos(startRad);
        const y1 = center + radius * Math.sin(startRad);
        const x2 = center + radius * Math.cos(endRad);
        const y2 = center + radius * Math.sin(endRad);
        const largeArc = angle > 180 ? 1 : 0;
        const d = `M${center},${center} L${x1},${y1} A${radius},${radius} 0 ${largeArc},1 ${x2},${y2} Z`;
        const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
        path.setAttribute("d", d); path.setAttribute("class", "sector"); path.setAttribute("id", `sec-${i}`);
        ui.svgGroup.appendChild(path);
        if (angles.length > 1) {
            const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
            line.setAttribute("x1", center); line.setAttribute("y1", center);
            line.setAttribute("x2", x1); line.setAttribute("y2", y1);
            line.setAttribute("class", "border-line");
            ui.svgGroup.appendChild(line);
        }
        currentAngle += angle;
    });
}

function resetVisuals() {
    document.querySelectorAll('.sector').forEach(s => s.classList.remove('filled'));
}

ui.startBtn.addEventListener('click', startGame);
ui.restartBtn.addEventListener('click', startGame);
ui.hitBtn.addEventListener('touchstart', handleInput, {passive: false});
ui.hitBtn.addEventListener('mousedown', handleInput);
ui.bpmRange.addEventListener('input', (e) => {
    BPM = parseInt(e.target.value);
    document.getElementById('bpm-val').textContent = BPM;
});
</script>
</body>
</html>
